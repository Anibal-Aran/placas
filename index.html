<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Placas de Formas de Pago</title>
<style>
/* Todo encerrado en .ingreso: si la app llegara a escribirse sobre esta página, estos estilos no la tocan. */
:root{--bg:#F2F3F5;--panel:#fff;--ink:#141A22;--ink2:#47515E;--line:#CDD2DA;--acc:#1D2331;--mal:#9A4B00;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0D1117;--panel:#161B22;--ink:#EEF1F5;--ink2:#C3CAD4;--line:#3A4250;
  --acc:#EEF1F5;--mal:#FFB869;color-scheme:dark}}
body{margin:0;background:var(--bg)}
.ingreso{box-sizing:border-box;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased}
.ingreso *{box-sizing:border-box}
.ingreso #f{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 22px;
  box-shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08)}
.ingreso h1{margin:0;font-size:20px;letter-spacing:-.01em}
.ingreso p{margin:4px 0 18px;color:var(--ink2);font-size:14px}
.ingreso label{display:block;font-weight:650;font-size:14px;margin-bottom:6px}
.ingreso input[type=password],.ingreso input[type=text]{width:100%;height:46px;border:1.5px solid var(--line);border-radius:10px;
  padding:0 12px;font:inherit;font-size:17px;background:var(--panel);color:var(--ink)}
.ingreso input:focus{outline:2px solid var(--acc);outline-offset:1px}
.ingreso .rec{display:flex;align-items:center;gap:8px;font-weight:500;margin:10px 0 0;color:var(--ink2)}
.ingreso .rec input{width:18px;height:18px;accent-color:var(--acc)}
.ingreso button{width:100%;height:46px;margin-top:16px;border:0;border-radius:10px;background:var(--acc);color:var(--panel);
  font:inherit;font-weight:750;font-size:15.5px;cursor:pointer}
.ingreso button:disabled{opacity:.6;cursor:wait}
.ingreso .mal{min-height:20px;margin:10px 0 0;color:var(--mal);font-size:13.5px}
.ingreso [hidden]{display:none !important}
</style>
</head>
<body>
<div class="ingreso">
<form id="f" hidden autocomplete="on">
  <h1>Placas de Formas de Pago</h1>
  <p>Uso interno del equipo de ventas.</p>
  <input type="text" name="username" value="placas-vendedores" autocomplete="username" hidden>
  <label for="clave">Clave</label>
  <input type="password" id="clave" name="password" autocomplete="current-password" required>
  <label class="rec"><input type="checkbox" id="ver"> Ver la clave</label>
  <label class="rec"><input type="checkbox" id="recordar" checked> Recordarla en este equipo</label>
  <button id="b">Entrar</button>
  <div class="mal" id="mal" role="alert"></div>
</form>
</div>

<script>
/* La app viaja cifrada con AES-256-GCM bajo una llave al azar. Esa llave está guardada dos veces: una cerrada
   con la clave de los vendedores y otra con la del administrador (las dos con PBKDF2-SHA256). Esta página sólo
   abre la app; cambiar claves se hace desde admin.html, con la clave de administrador.
   «Recordarla» guarda la llave de la app (no la clave) en este navegador; si el administrador cambia la clave
   de los vendedores, la llave cambia y se vuelve a pedir. ?salir la borra. */
(function () {
  'use strict';
  var A = JSON.parse(document.getElementById('acceso').textContent), GUARDADA = 'placas.llave';
  function bytes(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) { u[i] = b.charCodeAt(i); } return u; }
  function texto64(buf) {
    var u = new Uint8Array(buf), s = '';
    for (var i = 0; i < u.length; i += 32768) { s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); }
    return btoa(s);
  }
  function guardar(v) { try { if (v) { localStorage.setItem(GUARDADA, v); } else { localStorage.removeItem(GUARDADA); } } catch (e) {} }
  function leer() { try { return localStorage.getItem(GUARDADA); } catch (e) { return null; } }
  var f = document.getElementById('f'), mal = document.getElementById('mal'), b = document.getElementById('b');

  if (!window.crypto || !crypto.subtle) {
    f.hidden = false; b.disabled = true;
    mal.textContent = 'Este navegador no puede abrir la app. Abrila con Chrome, Safari, Edge o Firefox actualizados.';
    return;
  }
  if (/[?&]salir\b/.test(location.search)) { guardar(null); }

  function llaveApp(raw) { return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']); }
  function abrirApp(llave) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(A.app.iv) }, llave, bytes(A.app.ct)).then(function (plano) {
      return new TextDecoder().decode(plano);
    });
  }
  /** Reemplaza esta página por la app. Recién cuando terminó de cargar: antes, document.open() no hace nada
      y la app se escribe adentro de esta página, con sus estilos (pasaba con la clave recordada, que abre al
      instante). */
  function mostrar(html) {
    function escribir() { document.open(); document.write(html); document.close(); }
    if (document.readyState === 'complete') { setTimeout(escribir, 0); }
    else { window.addEventListener('load', function () { setTimeout(escribir, 0); }); }
  }
  function desdeClave(clave) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(A.vend.sal), iterations: A.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (kv) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(A.vend.iv) }, kv, bytes(A.vend.k));
    });
  }
  function pedir() { f.hidden = false; document.getElementById('clave').focus(); }
  /** La clave tal cual y, si no abre, sin lo que suele colarse al copiar y pegar: espacios, comillas,
      guiones largos, mayúsculas. */
  function variantes(c) {
    var n = String(c).replace(/[\u200B-\u200D\u2060\uFEFF]/g, '').replace(/\u00A0/g, ' ').trim()
      .replace(/^[`'"«»“”‘’]+|[`'"«»“”‘’]+$/g, '').trim().replace(/[\u2010-\u2015\u2212\uFE58\uFE63\uFF0D]/g, '-');
    var v = [c, n, n.toLowerCase(), n.replace(/\s+/g, '').toLowerCase()];
    return v.filter(function (x, i) { return x && v.indexOf(x) === i; });
  }
  function primeraQueAbra(lista, fn) {
    var i = 0;
    function sig(err) { if (i >= lista.length) { return Promise.reject(err); } return fn(lista[i++]).catch(sig); }
    return sig(new Error('sin clave'));
  }
  document.getElementById('ver').addEventListener('change', function () {
    document.getElementById('clave').type = this.checked ? 'text' : 'password';
  });

  var g = leer();
  if (g) {
    llaveApp(bytes(g)).then(abrirApp).then(mostrar).catch(function () { guardar(null); pedir(); });
  } else {
    pedir();
  }

  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var clave = document.getElementById('clave').value;
    if (!clave) { return; }
    b.disabled = true; b.textContent = 'Abriendo…'; mal.textContent = '';
    var raw;
    primeraQueAbra(variantes(clave), desdeClave).then(function (r) {
      raw = r;
      return llaveApp(raw).then(abrirApp);
    }).then(function (html) {
      if (document.getElementById('recordar').checked) { guardar(texto64(raw)); }
      mostrar(html);
    }).catch(function () {
      b.disabled = false; b.textContent = 'Entrar';
      mal.textContent = 'Clave incorrecta.';
      document.getElementById('clave').select();
    });
  });
})();
</script>
